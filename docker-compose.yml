services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aegisops
      POSTGRES_PASSWORD: aegisops
      POSTGRES_DB: aegisops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegisops -d aegisops"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    env_file:
      - ./.env
    environment:
      AIOPS_API_HOST: 0.0.0.0
      AIOPS_API_PORT: 4001
      AIOPS_DATABASE_URL: postgresql+asyncpg://aegisops:aegisops@postgres:5432/aegisops
      AIOPS_REDIS_URL: redis://redis:6379/0
      AIOPS_CELERY_BROKER_URL: redis://redis:6379/1
      AIOPS_CELERY_RESULT_BACKEND: redis://redis:6379/2
      AIOPS_TRACING_ENABLED: "true"
      AIOPS_OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    ports:
      - "4001:4001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4001/api/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    command: celery -A aegisops_api.worker worker --loglevel=info --concurrency=2
    env_file:
      - ./.env
    environment:
      AIOPS_DATABASE_URL: postgresql+asyncpg://aegisops:aegisops@postgres:5432/aegisops
      AIOPS_REDIS_URL: redis://redis:6379/0
      AIOPS_CELERY_BROKER_URL: redis://redis:6379/1
      AIOPS_CELERY_RESULT_BACKEND: redis://redis:6379/2
      AIOPS_TRACING_ENABLED: "true"
      AIOPS_OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    env_file:
      - ./.env
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://api:4001
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.61
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
