{{- if and .Values.api.enabled .Values.podDisruptionBudget.api.enabled -}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "aegisops.apiName" . }}
  labels:
    {{- include "aegisops.componentLabels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.api.minAvailable }}
  selector:
    matchLabels:
      {{- include "aegisops.componentSelectorLabels" (dict "root" . "component" "api") | nindent 6 }}
{{- end }}
