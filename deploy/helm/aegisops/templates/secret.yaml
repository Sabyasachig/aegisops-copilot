{{- if .Values.secret.create -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aegisops.secretName" . }}
  labels:
    {{- include "aegisops.labels" . | nindent 4 }}
type: Opaque
stringData:
  AIOPS_JWT_SECRET_KEY: {{ .Values.secret.data.jwtSecretKey | quote }}
  AIOPS_INITIAL_ADMIN_PASSWORD: {{ .Values.secret.data.initialAdminPassword | quote }}
  {{- with .Values.secret.data.databaseUrl }}
  AIOPS_DATABASE_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.data.redisUrl }}
  AIOPS_REDIS_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.data.celeryBrokerUrl }}
  AIOPS_CELERY_BROKER_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.data.celeryResultBackend }}
  AIOPS_CELERY_RESULT_BACKEND: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.data.webhookSecret }}
  AIOPS_WEBHOOK_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.data.groqApiKey }}
  AIOPS_GROQ_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.data.openaiApiKey }}
  AIOPS_OPENAI_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.data.anthropicApiKey }}
  AIOPS_ANTHROPIC_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.data.langsmithApiKey }}
  AIOPS_LANGSMITH_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.data.slackWebhookUrl }}
  AIOPS_SLACK_WEBHOOK_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.data.jiraUrl }}
  AIOPS_JIRA_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.data.jiraEmail }}
  AIOPS_JIRA_EMAIL: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.data.jiraApiToken }}
  AIOPS_JIRA_API_TOKEN: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.data.jiraProjectKey }}
  AIOPS_JIRA_PROJECT_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.data.datadogApiKey }}
  AIOPS_DATADOG_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.data.datadogAppKey }}
  AIOPS_DATADOG_APP_KEY: {{ . | quote }}
  {{- end }}
{{- end }}
